{% extends 'base.html' %}
{% block title %}Video Yükle{% endblock %}

{% block content %}
<div class="box" style="max-width: 500px; margin: 0 auto;">
    <h2 style="color: #e65c00; border-bottom: 2px solid #fee2e2; padding-bottom: 8px;">📤 Konu Anlatım Videosu Yükle</h2>
    <form method="POST" enctype="multipart/form-data">
        <label><b>Video Başlığı:</b></label><br>
        <input type="text" name="baslik" required style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <label><b>Açıklama:</b></label><br>
        <textarea name="aciklama" rows="3" required style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;"></textarea><br>

        <label><b>Video Dosyası Seç (.mp4):</b></label><br>
        <input type="file" name="video_dosya" accept="video/mp4,video/mov,video/avi" required style="width: 100%; margin: 4px 0 15px 0;"><br>

        <button type="submit" class="btn-orange" style="width: 100%;">Videoyu Yükle ve Yayınla</button>
    </form>
</div>
{% endblock %}
