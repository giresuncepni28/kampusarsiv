{% extends 'base.html' %}
{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="box" style="max-width: 380px; margin: 0 auto;">
    <h2 style="color: #e65c00; border-bottom: 2px solid #fee2e2; padding-bottom: 8px;">🔑 Giriş Yap</h2>
    <form method="POST">
        <label><b>Kullanıcı Adı:</b></label><br>
        <input type="text" name="kullanici_adi" required style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px;"><br>
        <label><b>Şifre:</b></label><br>
        <input type="password" name="sifre" required style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px;"><br>
        <button type="submit" class="btn-orange" style="width: 100%;">Giriş Yap</button>
    </form>
</div>
{% endblock %}
