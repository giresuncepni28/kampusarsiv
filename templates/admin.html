{% extends 'base.html' %}
{% block title %}Admin Paneli{% endblock %}

{% block content %}
<div class="card-box" style="padding: 18px;">
    <div class="card-header-light" style="padding:0 0 10px 0; margin-bottom:15px;">⚙️ Admin Paneli</div>
    <h4 style="margin:0 0 10px 0;">Konu Moderasyonu</h4>
    <table class="site-table">
        {% for k in konular %}
        <tr>
            <td>{{ k['baslik'] }} (Yazar: {{ k['yazar'] }}) &bull; <a href="/admin/sil_konu/{{ k['id'] }}" style="color:red; font-weight:bold;">[Sil]</a></td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
