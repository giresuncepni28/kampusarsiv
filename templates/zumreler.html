{% extends 'base.html' %}
{% block title %}Zümreler{% endblock %}

{% block content %}
<div class="box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="color: #e65c00; margin: 0;">👥 Zümre Odaları</h2>
        <a href="{{ url_for('zumre_olustur') }}" class="btn-orange">+ Yeni Zümre</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;">
        {% if zumreler %}
            {% for z in zumreler %}
                <div style="border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; background: #fffaf5;">
                    <h3 style="color: #e65c00; margin-top: 0;">{{ z.baslik }}</h3>
                    <p style="font-size: 0.9rem; color: #555;">{{ z.aciklama }}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                        <span style="font-size: 0.8rem; color: #888;">Branş: {{ z.brans }}</span>
                        <a href="{{ url_for('zumre_detay', zumre_id=z.id) }}" class="btn-orange" style="padding: 4px 10px; font-size: 0.85rem;">Sohbete Gir →</a>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p style="color: #888;">Zümre bulunamadı.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
