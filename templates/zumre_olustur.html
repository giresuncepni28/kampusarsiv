{% extends 'base.html' %}
{% block title %}Zümre Oluştur{% endblock %}

{% block content %}
<div class="box" style="max-width: 450px; margin: 0 auto;">
    <h2 style="color: #e65c00; border-bottom: 2px solid #fee2e2; padding-bottom: 8px;">➕ Yeni Zümre</h2>
    <form method="POST">
        <label><b>Başlık:</b></label><br>
        <input type="text" name="baslik" required style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <label><b>Branş:</b></label><br>
        <input type="text" name="brans" required style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <label><b>Açıklama:</b></label><br>
        <textarea name="aciklama" rows="3" required style="width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;"></textarea><br>

        <button type="submit" class="btn-orange" style="width: 100%;">Oluştur</button>
    </form>
</div>
{% endblock %}
