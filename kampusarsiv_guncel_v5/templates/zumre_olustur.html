{% extends 'base.html' %}
{% block title %}Zümre Oluştur - KampüsArşiv{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="color: #ff6600; margin-bottom: 15px; border-bottom: 2px solid #ffd8bd; padding-bottom: 8px;">➕ Yeni Zümre Oluştur</h2>
    <form method="POST">
        <label style="font-weight: 600;">Zümre Başlığı / Branş:</label><br>
        <input type="text" name="baslik" placeholder="Örn: 9. Sınıf Matematik Zümresi" style="width: 100%; padding: 10px; margin: 6px 0 14px 0; border: 1px solid #ffd8bd; border-radius: 6px;" required><br>
        
        <label style="font-weight: 600;">Açıklama / Amaç:</label><br>
        <textarea name="aciklama" rows="4" placeholder="Zümre hakkında kısa bilgi ve kurallar..." style="width: 100%; padding: 10px; margin: 6px 0 14px 0; border: 1px solid #ffd8bd; border-radius: 6px; font-family: inherit;" required></textarea><br>
        
        <button type="submit" class="btn" style="width: 100%; padding: 12px;">Zümreyi Yayınla</button>
    </form>
</div>
{% endblock %}
