{% extends 'base.html' %}
{% block title %}Giriş Yap - KampüsArşiv{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 0 auto;">
    <h2 style="color: #ff6600; margin-bottom: 15px; border-bottom: 2px solid #ffd8bd; padding-bottom: 8px;">🔑 Giriş Yap</h2>
    <form method="POST">
        <label style="font-weight: 600;">Kullanıcı Adı:</label><br>
        <input type="text" name="kullanici_adi" style="width: 100%; padding: 10px; margin: 6px 0 14px 0; border: 1px solid #ffd8bd; border-radius: 6px; font-family: inherit;" required><br>
        
        <label style="font-weight: 600;">Şifre:</label><br>
        <input type="password" name="sifre" style="width: 100%; padding: 10px; margin: 6px 0 14px 0; border: 1px solid #ffd8bd; border-radius: 6px; font-family: inherit;" required><br>
        
        <button type="submit" class="btn" style="width: 100%; padding: 12px;">Giriş Yap</button>
    </form>
</div>
{% endblock %}
